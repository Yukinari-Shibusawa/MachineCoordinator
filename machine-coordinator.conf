# Copy to machine-coordinator.conf and replace ports and limits for your machine.
# Relative paths are resolved from this config file's directory.
marlin_port=/dev/ttyUSB0
marlin_baud=115200
belt_name=A
arduino_config=../ArduinoController/arduino-controller.conf
program=programs/fill-one-cup.asm

# These are example limits, not verified machine dimensions. Set them to the
# actual safe travel limits and speeds before enabling physical motion.
max_x_mm=220
max_y_mm=220
max_z_mm=180
max_move_mm=220
max_feedrate_mm_min=50000
max_duration_ms=15000
command_timeout_ms=20000
